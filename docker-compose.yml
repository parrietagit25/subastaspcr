version: '3.1'

services:
  php:
    build: .
    volumes:
      - ./php20:/var/www/html
    ports:
      - 8082:80  
      - 4443:443  
    restart: always

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    volumes:
      # Volumen NOMBRADO: no se borra con docker compose down (salvo -v).
      - subastas_mysql_data:/var/lib/mysql
      # Solo se ejecuta si el volumen está vacío (primera vez).
      - ./php20/fix_schema.sql:/docker-entrypoint-initdb.d/01_fix_schema.sql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: subastas  
      MYSQL_USER: parrieta
      MYSQL_PASSWORD: Subastas2023

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - 8083:80  
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpass

volumes:
  subastas_mysql_data:
